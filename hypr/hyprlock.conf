general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /home/abib-pratama/Pictures/wallpaper.jpg   # Pastikan wallpaper kamu ada di sini
    blur_passes = 2
    contrast = 0.89
    brightness = 0.8
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    outer_color = rgb(ff5e5e)
    inner_color = rgb(10, 10, 10)
    font_color = rgb(ffffff)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 80
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}
