# Monitor Setup (Disesuaikan dengan scaling 1.25x kamu)
monitor=,highres,auto,1.25

# Autostart
exec-once = hyprpaper
exec-once = swaybg -i /home/abib-pratama/Pictures/wallpaper.jpg -m fill
exec-once = mako
exec-once = sleep 1 && waybar

# Input
input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Estetika (Gaps & Borders)
general {
    gaps_in = 8
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(ff5e5eff) rgba(ffaa00ff) 45deg
    col.inactive_border = rgba(595959aa)
}

# Efek Blur (Pengganti Blur My Shell)
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
	enabled = true
	range = 4
	render_power = 3
	color = rgba(1a1a1aee)
    }
}

# Keybindings Utama
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, L, exec, swaylock
bind = $mainMod, X, exec, ~/.config/hypr/powermenu.sh

# Navigasi Window (Mirip Vim)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Menggerakan Jendela dengan Super + Mouse Kiri
bindm = $mainMod, mouse:272, movewindow

# Mengubah ukuran jendela dengan super + mose kanan
bindm = $mainMod, mouse:273, resizewindow

# Jendela Floating
bind = $mainMod, V, togglefloating,

# Tutup jendela yang aktif
bind = $mainMod, C, killactive,

# Minimize window
bind = $mainMod, MINUS, movetoworkspace, special:magic

# Restore Window
bind = $mainMod, MINUS, togglespecialworkspace, magic

# Full screen
bind = $mainMod, F, fullscreen,

# Volume dengan Notifikasi
bindle = , XF86AudioRaiseVolume, exec, pamixer -i 5 && notify-send -h string:x-canonical-private-synchronous:sys-notify -u low -t 1000 "Volume: $(pamixer --get-volume)%"
bindle = , XF86AudioLowerVolume, exec, pamixer -d 5 && notify-send -h string:x-canonical-private-synchronous:sys-notify -u low -t 1000 "Volume: $(pamixer --get-volume)%"

# Kecerahan dengan Notifikasi (Super + F6/F7 atau Tombol Brightness)
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && notify-send -h string:x-canonical-private-synchronous:brightness-notify -u low -t 1000 "󰃠 Brightness: $(brightnessctl -m | cut -d, -f4)"
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send -h string:x-canonical-private-synchronous:brightness-notify -u low -t 1000 "󰃠 Brightness: $(brightnessctl -m | cut -d, -f4)"

# Screenshot area (Super + Shift + S)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
